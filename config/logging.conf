[loggers]
keys=root

[handlers]
keys=console,debug_file,error_file

[formatters]
keys=dated

[handler_console]
class=StreamHandler
level=DEBUG
formatter=dated
args=(sys.stdout,)

[handler_debug_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=dated
filename=logs/app.log
mode=a
maxsize=500000
backcount=9
args=('logs/app.log', 'a', 900000, 5)

[handler_error_file]
class=handlers.RotatingFileHandler
level=ERROR
formatter=dated
filename=logs/error.log
mode=a
maxsize=500000
backcount=9
args=('logs/app.log', 'a', 900000, 5)

[formatter_dated]
class=colorlog.ColoredFormatter
format=%(log_color)s%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
style=%
validate=True
defaults={'customfield': 'defaultvalue'}

[logger_root]
level=DEBUG
handlers=console,debug_file,error_file