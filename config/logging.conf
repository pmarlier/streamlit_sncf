[loggers]
keys=root

[handlers]
keys=console,debug_file,error_file

[formatters]
keys=dated

[handler_console]
class=StreamHandler
level=DEBUG
formatter=dated
args=(sys.stdout,)

[handler_debug_file]
class=FileHandler
level=DEBUG
formatter=dated
args=('logs/app.log', 'w')

[handler_error_file]
class=FileHandler
level=ERROR
formatter=dated
args=('logs/error.log', 'w')

[formatter_dated]
class=colorlog.ColoredFormatter
format=%(log_color)s%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
style=%
validate=True
defaults={'customfield': 'defaultvalue'}

[logger_root]
level=DEBUG
handlers=console,debug_file,error_file