name: Docker Build & Push

on:
  push:
    branches:
      - main  # Runs the workflow on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

        # just for the sake of this course
        # since we don't do anything further with this wonderful docker image
      - name: Build Docker Image
        run: docker build -t pmarlier/streamlit_sncf:latest .

        # instead, we plug our git repo on the streamlit cloud through a deploy link
        # and streamlit cloud empowers in itself a CD workflow