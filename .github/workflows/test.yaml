name: CI Pipeline

# Permissions minimales déclarées au niveau du workflow
permissions:
  contents: read

on:
# call test on each pull request and on each final push
  push:
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Install Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: '3.14'

      - name: Checkout project 
      # official reference for GitHub checkout service
        uses: actions/checkout@v4 

      - name: Install Dependancies
        run: | 
          python -m pip install --upgrade pip
          pip install uv
          uv sync
      
      - name: Lancer les tests
        run: .venv/bin/py.test
    
# we don't have any linting jobs here because we set our RUFF config
# in a settings.json file in a .vscode